consent:
  title: "ક્લિનિકલ ઇનટેક અને ગોપનીયતા સંમતિ"
  welcome: "નમસ્તે. આ ઇન્ટરવ્યુ તમારા ડૉક્ટરને તમારા માથાના દુખાવાની વિગતો સમજવામાં મદદ કરે છે."
  purpose_body: "1. હેતુ: આ પ્રણાલી તમારા ડૉક્ટર માટે વ્યવસ્થિત અહેવાલ તૈયાર કરવા માટે લક્ષણો એકત્રિત કરે છે.\n2. નિદાન નથી: આ ચેટબોટ કોઈ નિદાન કે દવા સૂચવતું નથી. અંતિમ નિર્ણય ડૉક્ટરનો રહેશે.\n3. કટોકટી: જો તમને અચાનક અસહ્ય માથાનો દુખાવો કે પક્ષાઘાત જેવા લક્ષણ જણાય, તો તાત્કાલિક ઇમરજન્સી સેવા લો.\n4. ગોપનીયતા: તમારો ડેટા સંપૂર્ણ સુરક્ષિત છે અને ફક્ત અનામી સેશન કોડ સાથે જોડાયેલ છે."
  agree_terms: "મેં બધી શરતો સમજી લીધી છે અને આગળ વધવા સંમત છું."
  research_consent: "વૈકલ્પિક: હું મારા અનામી ડેટાને માથાના દુખાવાના સંશોધન અભ્યાસમાં સમાવવા માટે સંમતિ આપું છું."
  continue_button: "હું સંમત છું અને શરૂ કરો"

