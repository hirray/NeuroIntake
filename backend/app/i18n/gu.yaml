questions:
  E1: "શું તમારો માથાનો દુખાવો અચાનક શરૂ થયો હતો અને લગભગ 1 મિનિટમાં અત્યંત અસહ્ય થઈ ગયો હતો (જાણે કોઈ મોટો ધડાકો થયો હોય)?"
  E2: "શું આ તમારા જીવનનો સૌથી ભયંકર માથાનો દુખાવો છે, અથવા પહેલીવાર આટલો તીવ્ર દુખાવો થયો છે?"
  E3: "શું તમને શરીરમાં કોઈ નવી નબળાઈ, સુન્નતા, બોલવામાં તકલીફ કે ગૂંચવણ અનુભવાય છે જે સામાન્ય દુખાવા કરતાં અલગ છે?"
  E4: "શું તમે બેભાન થયા હતા, ખેંચ આવી હતી કે અચાનક સભાનતા ગુમાવી હતી?"
  E5: "શું તમને તાવ સાથે ગરદનમાં અકડાઈ અથવા શરીર પર કોઈ નવા ચકામા છે?"
  E6: "શું તમારી આંખોની દ્રષ્ટિમાં અચાનક ઘટાડો થયો છે અથવા જોવામાં મોટો ફેરફાર થયો છે?"
  E7: "શું આ માથાનો દુખાવો માથામાં કોઈ ઇજા કે વાગ્યા પછી તરત શરૂ થયો હતો?"
  E8: "શું તમારો માથાનો દુખાવો 50 વર્ષની ઉંમર પછી પહેલીવાર શરૂ થયો, અથવા તાજેતરમાં દુખાવાનું સ્વરૂપ ખૂબ બદલાઈ ગયું છે?"

  P1: "તમારી હાલની ઉંમર (વર્ષોમાં) કેટલી છે?"
  P2: "જન્મ સમયે તમારી જૈવિક જાતિ કઈ હતી?"
  P3: "તમારી ઊંચાઈ કેટલી છે (સેન્ટીમીટરમાં, વૈકલ્પિક)?"
  P4: "તમારું વજન કેટલું છે (કિલોગ્રામમાં, વૈકલ્પિક)?"
  P5: "તમને પહેલીવાર માથાનો દુખાવો આશરે કઈ ઉંમરે શરૂ થયો હતો?"
  P6: "તમારા આખા જીવનમાં તમે આશરે કેટલી વાર માથાના દુખાવાનો હુમલો અનુભવ્યો છે?"

  H1: "જ્યારે તમે દવા નથી લેતા, ત્યારે સામાન્ય રીતે એક હુમલો કેટલો સમય ચાલે છે?"
  H2: "સરેરાશ એક મહિનામાં તમને કેટલા દિવસ માથાનો દુખાવો થાય છે?"
  H3: "માથાનો દુખાવો સામાન્ય રીતે માથાના કયા ભાગમાં થાય છે?"
  H4: "દુખાવાનો પ્રકાર કેવો હોય છે (ધબકારા જેવો, સતત દબાણ, વગેરે)?"
  H5: "સામાન્ય રીતે તમારા માથાના દુખાવાની તીવ્રતા કેટલી હોય છે?"
  H6: "શું સામાન્ય શારીરિક હલનચલન (જેમ કે ચાલવું કે સીડી ચડવી) થી દુખાવો વધુ વધી જાય છે?"
  H7: "શું માથાના દુખાવા દરમિયાન તમને ઉબકા આવે છે (ઊલટી જેવું થાય છે)?"
  H8: "શું માથાના દુખાવા દરમિયાન ખરેખર ઊલટી થાય છે?"
  H9: "શું સામાન્ય અવાજો માથાના દુખાવા દરમિયાન કાનમાં ખૂંચે છે અથવા અસહ્ય લાગે છે?"
  H10: "શું સામાન્ય પ્રકાશ માથાના દુખાવા દરમિયાન આંખોમાં ખૂંચે છે કે દર્દ કરે છે?"

  A1: "શું માથાના દુખાવા પહેલાં કે દરમિયાન તમને આંખો સામે એવા લક્ષણો દેખાય છે જે પછી સંપૂર્ણપણે ગાયબ થઈ જાય છે?"
  A2: "શું તમને શરીરમાં કામચલાઉ સુન્નતા કે ઝણઝણાટી અનુભવાય છે જે ફેલાય છે અને પછી સંપૂર્ણપણે મટી જાય છે?"
  A3: "શું હુમલા દરમિયાન યોગ્ય શબ્દો શોધવામાં કે સ્પષ્ટ બોલવામાં તકલીફ પડે છે?"
  A4: "શું હુમલા દરમિયાન તમારી જીભ લથડે છે અથવા શબ્દો અસ્પષ્ટ સંભળાય છે?"
  A5: "શું તમને માથાના દુખાવા સાથે ચક્કર આવવા કે રૂમ ગોળ ફરતી હોય તેવું લાગે છે?"
  A6: "શું તમને કાનમાં સીટી કે ગૂંજવા જેવો અવાજ સંભળાય છે?"
  A7: "શું હુમલા દરમિયાન સાંભળવામાં કોઈ કામચલાઉ ઘટાડો થાય છે?"
  A8: "શું હુમલા દરમિયાન તમને વસ્તુઓ બેવડી (ડબલ) દેખાય છે?"
  A9: "શું બંને આંખો સામે કોઈ અંધ બિંદુ આવે છે જ્યાં દેખાતું બંધ થઈ જાય છે?"
  A10: "શું હુમલા દરમિયાન ચાલતી વખતે સંતુલન બગડે છે અથવા લથડાઈ જવાય છે?"
  A11: "શું હુમલા દરમિયાન તમારી સભાનતા ઘટે છે કે બેભાન થઈ જાઓ છો?"
  A12: "શું શરીરની બંને બાજુએ એક સાથે ઝણઝણાટી કે સુન્નતા અનુભવાય છે?"
  A13: "શું માથાના દુખાવા દરમિયાન શરીરની કોઈ એક બાજુના સ્નાયુઓમાં નબળાઈ અનુભવાય છે?"
  A14: "આ ચેતવણીરૂપ કે ન્યુરોલોજીકલ લક્ષણો સામાન્ય રીતે કેટલો સમય ચાલે છે?"
  A15: "શું હુમલો પૂરો થયા પછી આ બધા લક્ષણો સંપૂર્ણપણે ગાયબ થઈ જાય છે?"
  A16: "શું આ લક્ષણો ધીમે ધીમે 5 મિનિટ કે તેથી વધુ સમયમાં વધે છે?"
  A17: "શું બે કે તેથી વધુ લક્ષણો એક પછી એક ક્રમમાં આવે છે?"
  A18: "શું આ લક્ષણો શરીર કે જોવાની ફક્ત એક જ બાજુએ અનુભવાય છે?"
  A19: "શું માથાનો દુખાવો આ લક્ષણો દરમિયાન અથવા શરૂ થયાની 60 મિનિટમાં ઉપડે છે?"

  F1: "શું તમારા પરિવારમાં (માતા-પિતા, ભાઈ-બહેન, બાળકો) કોઈને માઈગ્રેન કે ગંભીર માથાના દુખાવાની તકલીફ છે?"
  F2: "શું તમને કોઈ અન્ય લાંબી બીમારી છે (જેમ કે બીપી, ડાયાબિટીસ વગેરે)? જો હા, તો લખો અથવા 'કંઈ નહીં' પસંદ કરો."
  F3: "માથાનો દુખાવો શરૂ થાય ત્યારે તમે કઈ દવા લો છો, અને મહિનામાં આશરે કેટલા દિવસ લો છો?"
  F4: "શું તમે માથાનો દુખાવો રોકવા માટે કોઈ દૈનિક દવા લીધી છે કે લો છો?"
  F5: "શું તમે મહિનામાં 10 કે તેથી વધુ દિવસ દુખાવાની દવા લો છો?"
  F6: "તમારા મતે કયા કારણોસર માથાનો દુખાવો શરૂ થાય છે? (બધા લાગુ પડતા વિકલ્પો પસંદ કરો)"
  F7: "શું સ્ત્રીઓમાં માસિક ધર્મના દિવસોમાં માથાનો દુખાવો નિયમિતપણે થાય છે?"
  F8: "શું તમે તમારા માથાના દુખાવા વિશે ડૉક્ટરને બીજું કંઈ જણાવવા માંગો છો?"

  L1: "વૈકલ્પિક જીવનશૈલી: તમે રાત્રે સરેરાશ કેટલા કલાક ઊંઘો છો?"
  L2: "0 થી 10 ના સ્કેલ પર, તમે તમારા દૈનિક તણાવનું સ્તર કેટલું આંકશો?"
  L3: "તમે દરરોજ આશરે કેટલું પાણી પીવો છો (લીટર કે ગ્લાસમાં)?"
  L4: "તમે દરરોજ કેટલી ચા કે કોફી પીવો છો?"
  L5: "તમે દરરોજ આશરે કેટલા કલાક સ્ક્રીન (મોબાઈલ, કોમ્પ્યુટર કે ટીવી) જુઓ છો?"

