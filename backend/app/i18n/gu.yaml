red_flag_alert:
  title: "તાત્કાલિક તબીબી સારવાર જરૂરી"
  message: "તમે જણાવેલ લક્ષણ મુજબ તમારે તરત જ ડૉક્ટર પાસે જવાની જરૂર છે. કૃપા કરીને તરત જ નજીકના ઇમરજન્સી વિભાગ અથવા ડૉક્ટરનો સંપર્ક કરો. જો તમે તરત જ ન પહોંચી શકો તો રાષ્ટ્રીય ઇમરજન્સી નંબર 112 અથવા એમ્બ્યુલન્સ 108 પર કૉલ કરો. આ રિપોર્ટની રાહ જોશો નહીં."
  instruction: "ઇન્ટરવ્યુ સુરક્ષિત રીતે રોકી દેવામાં આવ્યો છે. તમારા ડૉક્ટર માટે ટૂંકો કટોકટી સારાંશ તૈયાર કરવામાં આવ્યો છે."

