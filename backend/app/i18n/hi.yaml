consent:
  title: "नैदानिक इनटेक एवं गोपनीयता सहमति"
  welcome: "नमस्ते। यह इनटेक साक्षात्कार परामर्श से पहले आपके डॉक्टर को आपके सिरदर्द के इतिहास को समझने में मदद करता है।"
  purpose_body: "1. उद्देश्य: यह प्रणाली आपके डॉक्टर के लिए संरचित रिपोर्ट तैयार करने हेतु सिरदर्द के लक्षण एकत्र करती है।\n2. निदान नहीं: यह चैटबॉट कोई बीमारी का निदान नहीं करता और न ही दवा लिखता है। अंतिम निर्णय डॉक्टर का होगा।\n3. आपातकालीन स्थिति: यदि आपको अचानक असहनीय सिरदर्द या पक्षाघात के लक्षण महसूस हों, तो तुरंत आपातकालीन सेवा लें।\n4. गोपनीयता: आपका डेटा सुरक्षित है और केवल अनाम सत्र कोड से जुड़ा है।"
  agree_terms: "मैंने नियम समझ लिए हैं और मैं आगे बढ़ने के लिए सहमत हूँ।"
  research_consent: "वैकल्पिक: मैं अपने अनाम डेटा को सिरदर्द अनुसंधान अध्ययन में शामिल करने की सहमति देता/देती हूँ।"
  continue_button: "मैं सहमत हूँ और शुरू करें"

acknowledgements:
  - "धन्यवाद। इससे मदद मिलेगी।"
  - "समझ गया, धन्यवाद।"
  - "जानकारी दर्ज कर ली गई है।"
  - "बताने के लिए धन्यवाद।"
  - "नोट कर लिया गया है, धन्यवाद।"

red_flag_alert:
  title: "तत्काल चिकित्सीय परामर्श आवश्यक"
  message: "आपके द्वारा बताए गए लक्षण के अनुसार आपको तुरंत डॉक्टर से मिलने की आवश्यकता है। कृपया तुरंत किसी नजदीकी आपातकालीन विभाग (इमरजेंसी) या डॉक्टर से संपर्क करें। यदि तुरंत अस्पताल नहीं जा सकते तो राष्ट्रीय आपातकालीन नंबर 112 या एम्बुलेंस 108 पर कॉल करें। इस रिपोर्ट की प्रतीक्षा न करें।"
  instruction: "साक्षात्कार सुरक्षित रूप से रोक दिया गया है। आपके डॉक्टर के लिए एक संक्षिप्त आपातकालीन सारांश तैयार किया गया है।"

confirmation:
  voice_echo: "मैंने समझा: \"{value}\"। क्या यह सही है?"
  buttons:
    yes: "हाँ, यह सही है"
    no: "नहीं, बदलना है"

completion:
  thank_you: "धन्यवाद। आपके उत्तर सुरक्षित रूप से दर्ज कर लिए गए हैं और डॉक्टर की समीक्षा के लिए तैयार हैं।"
  summary_title: "इनटेक सारांश"
  download_btn: "मरीज सारांश पीडीएफ डाउनलोड करें"
  status_notice: "स्थिति: डॉक्टर की समीक्षा हेतु तैयार। आपके डॉक्टर परामर्श के दौरान इस पर चर्चा करेंगे।"

questions:
  E1: "क्या आपका सिरदर्द अचानक शुरू हुआ और लगभग 1 मिनट के भीतर अत्यधिक असहनीय हो गया (जैसे कोई धमाका हुआ हो)?"
  E2: "क्या यह आपके जीवन का सबसे भयंकर सिरदर्द है, या पहली बार इतना तेज सिरदर्द हुआ है?"
  E3: "क्या आपको शरीर में कोई नई कमजोरी, सुन्नता, बोलने में परेशानी या उलझन महसूस हो रही है जो सामान्य से अलग है?"
  E4: "क्या आप बेहोश हुए, दौरा पड़ा, या आपकी सतर्कता में अचानक भारी गिरावट आई?"
  E5: "क्या आपको बुखार के साथ गर्दन में अकड़न या त्वचा पर कोई नया दाना/चकत्ता है?"
  E6: "क्या आपकी आंखों की रोशनी में अचानक कोई कमी आई है या देखने में बड़ा बदलाव हुआ है?"
  E7: "क्या यह सिरदर्द सिर पर किसी चोट या आघात के तुरंत बाद शुरू हुआ था?"
  E8: "क्या आपका सिरदर्द 50 वर्ष की आयु के बाद पहली बार शुरू हुआ, या हाल ही में इसका स्वरूप बहुत ज्यादा बदल गया है?"

  P1: "आपकी वर्तमान आयु (वर्षों में) कितनी है?"
  P2: "जन्म के समय आपका जैविक लिंग क्या था?"
  P3: "आपकी ऊंचाई कितनी है (सेंटीमीटर में, वैकल्पिक)?"
  P4: "आपका वजन कितना है (किलोग्राम में, वैकल्पिक)?"
  P5: "आपको पहली बार सिरदर्द लगभग किस उम्र में शुरू हुआ था?"
  P6: "अपने पूरे जीवन में आपने लगभग कितने सिरदर्द के दौरों का अनुभव किया है?"

  H1: "जब आप बिना दवा लिए सिरदर्द सहते हैं, तो आमतौर पर एक दौरा कितने समय तक रहता है?"
  H2: "औसतन एक महीने में आपको कितने दिन सिरदर्द होता है?"
  H3: "सिरदर्द का दर्द आमतौर पर सिर में किस स्थान पर होता है?"
  H4: "दर्द का प्रकार कैसा होता है (जैसे धड़कने जैसा, लगातार दबाव, आदि)?"
  H5: "आमतौर पर आपके सिरदर्द की तीव्रता कितनी गंभीर होती है?"
  H6: "क्या सामान्य शारीरिक गतिविधियाँ (जैसे चलना या सीढ़ियां चढ़ना) करने से सिरदर्द और अधिक बढ़ जाता है?"
  H7: "क्या सिरदर्द के दौरान आपका जी मिचलाता है (उल्टी जैसा महसूस होना)?"
  H8: "क्या सिरदर्द के दौरान आपको वास्तव में उल्टी होती है?"
  H9: "क्या सिरदर्द के दौरान सामान्य आवाजें आपको परेशान या दर्दनाक लगती हैं (ध्वनि संवेदनशीलता)?"
  H10: "क्या सिरदर्द के दौरान सामान्य रोशनी आपकी आंखों में चुभती है (प्रकाश संवेदनशीलता)?"

  A1: "क्या सिरदर्द से पहले या उसके दौरान आपको आंखों के सामने ऐसे लक्षण दिखते हैं जो बाद में पूरी तरह गायब हो जाते हैं?"
  A2: "क्या आपको शरीर में अस्थायी सुन्नता या झुनझुनी महसूस होती है जो फैलती है और फिर पूरी तरह ठीक हो जाती है?"
  A3: "क्या सिरदर्द के दौरों के दौरान शब्दों को याद करने या बोलने में अस्थायी परेशानी होती है?"
  A4: "क्या सिरदर्द के दौरान आपकी आवाज लड़खड़ाती है या शब्द अस्पष्ट हो जाते हैं?"
  A5: "क्या आपको सिरदर्द के साथ चक्कर आने या कमरा घूमने जैसा महसूस होता है?"
  A6: "क्या आपको कानों में सीटी या घंटी बजने जैसी आवाज सुनाई देती है?"
  A7: "क्या सिरदर्द के दौरान आपको सुनने में कोई अस्थायी कमी महसूस होती है?"
  A8: "क्या सिरदर्द के दौरान आपको चीजें दोहरी (डबल) दिखाई देती हैं?"
  A9: "क्या दोनों आंखों के सामने कोई अंधा धब्बा आ जाता है जहां दिखना बंद हो जाता है?"
  A10: "क्या सिरदर्द के दौरान चलने में संतुलन बिगड़ता है या लड़खड़ाहट होती है?"
  A11: "क्या सिरदर्द के दौरान आपकी चेतना कम होती है या बेहोशी आती है?"
  A12: "क्या शरीर के दोनों तरफ एक साथ झुनझुनी या सुन्नता महसूस होती है?"
  A13: "क्या सिरदर्द के दौरान शरीर के किसी एक हिस्से की मांसपेशियों में कमजोरी महसूस होती है?"
  A14: "ये चेतावनी या न्यूरोलॉजिकल लक्षण आमतौर पर कितने समय तक रहते हैं?"
  A15: "क्या दौरा खत्म होने के बाद ये सभी चेतावनी लक्षण पूरी तरह ठीक हो जाते हैं?"
  A16: "क्या ये चेतावनी लक्षण धीरे-धीरे 5 मिनट या उससे अधिक समय में बढ़ते हैं?"
  A17: "क्या दो या दो से अधिक अलग-अलग लक्षण एक के बाद एक क्रम में आते हैं?"
  A18: "क्या ये चेतावनी लक्षण शरीर या दृष्टि के केवल एक तरफ महसूस होते हैं?"
  A19: "क्या सिरदर्द इन चेतावनी लक्षणों के दौरान या उनके शुरू होने के 60 मिनट के भीतर शुरू होता है?"

  F1: "क्या आपके परिवार (माता-पिता, भाई-बहन, बच्चे) में किसी को माइग्रेन या बार-बार गंभीर सिरदर्द की समस्या है?"
  F2: "क्या आपको कोई अन्य पुरानी बीमारी है (जैसे बीपी, शुगर, थायराइड आदि)? यदि हाँ, तो लिखें या 'कोई नहीं' चुनें।"
  F3: "सिरदर्द शुरू होने पर आप कौन सी दवाएं लेते हैं, और महीने में लगभग कितने दिन लेते हैं?"
  F4: "क्या आप सिरदर्द रोकने के लिए कोई नियमित दवा लेते हैं या पहले ली है?"
  F5: "क्या आप महीने में 10 या उससे अधिक दिन दर्द निवारक दवा लेते हैं?"
  F6: "आपके अनुसार किन कारणों से आपका सिरदर्द बढ़ता या शुरू होता है? (सभी लागू विकल्प चुनें)"
  F7: "क्या महिलाओं में सिरदर्द मासिक धर्म (पीरियड्स) के दिनों में नियमित रूप से होता है?"
  F8: "क्या आप अपने सिरदर्द के बारे में डॉक्टर को कुछ और बताना चाहते हैं?"

  L1: "वैकल्पिक जीवनशैली: आप औसतन रात में कितने घंटे सोते हैं?"
  L2: "0 से 10 के पैमाने पर, आप अपने दैनिक तनाव का स्तर क्या आंकेंगे?"
  L3: "आप रोजाना लगभग कितना पानी पीते हैं (लीटर या गिलास में)?"
  L4: "आप रोजाना कितनी चाय या कॉफी पीते हैं?"
  L5: "आप रोजाना लगभग कितने घंटे मोबाइल, कंप्यूटर या टीवी स्क्रीन देखते हैं?"

