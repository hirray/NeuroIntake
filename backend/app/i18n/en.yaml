consent:
  title: "Clinical Intake & Privacy Consent"
  welcome: "Welcome. This intake interview helps your doctor understand your headache history before your consultation."
  purpose_body: "1. Purpose: This system collects your headache symptoms to prepare a structured report for your treating doctor.\n2. Not a Diagnosis: This chatbot does NOT diagnose conditions, prescribe medications, or adjust doses. A qualified doctor will review all information.\n3. Emergencies: If you experience sudden, unbearable headache or sudden neurological symptoms, please seek emergency care.\n4. Privacy: Your answers are protected and linked only to an anonymous session code."
  agree_terms: "I understand and agree to proceed with this intake interview."
  research_consent: "Optional: I consent to having my anonymized headache answers included in headache research studies."
  continue_button: "I Agree & Begin"

acknowledgements:
  - "Thank you. That helps."
  - "Got it, thank you."
  - "Understood."
  - "Thank you for sharing that."
  - "Noted, thank you."

red_flag_alert:
  title: "URGENT MEDICAL ATTENTION RECOMMENDED"
  message: "Based on the symptom you described, you need a doctor's attention promptly. Please contact a doctor or go to the nearest emergency room right away. If you cannot travel immediately, call national emergency 112 or ambulance 108. Do not wait for this questionnaire."
  instruction: "The interview has been safely paused. A brief emergency summary has been prepared for your healthcare provider."

confirmation:
  voice_echo: "I understood: \"{value}\". Is this correct?"
  buttons:
    yes: "Yes, that's right"
    no: "No, let me change"

completion:
  thank_you: "Thank you. Your answers have been safely recorded and prepared for your doctor to review."
  summary_title: "Intake Summary"
  download_btn: "Download Patient Summary PDF"
  status_notice: "Status: Ready for clinician review. Your doctor will discuss these findings with you."

questions:
  E1: "First, a few quick safety checks. Please select any of the following that apply to your current headache — or choose 'None' if none apply:"
  E2: "A few more safety signs — please select any that describe your current situation, or choose 'None':"

  P1: "What is your current age in years?"
  P2: "What was your biological sex assigned at birth?"
  P3: "Around what age did your headaches first begin?"
  P4: "Approximately how many headache attacks have you experienced in your whole life?"

  H1: "When you do not take pain medication, how long does a typical headache attack usually last?"
  H2: "On average, how many days per month do you experience a headache?"
  H3: "Where is the pain usually located on your head?"
  H4: "How would you best describe the sensation of the pain?"
  H5: "How intense is your headache at its worst?"
  H6: "Does routine physical activity (such as walking or climbing stairs) make your headache noticeably worse?"
  H7: "During a headache attack, do you experience any of the following? (Select all that apply)"
  H8: "During a headache attack, are you sensitive to any of the following? (Select all that apply)"

  A1: "Do you get any temporary visual disturbances before or during the headache that fully disappear? (Select all that apply)"
  A2: "Do you experience any of these other neurological warning signs before or during your headache? (Select all that apply)"
  A3: "When you experience these warning symptoms, how long do they typically last?"

  F1: "Does anyone in your immediate family (parents, siblings, children) have diagnosed migraine or recurrent severe headaches?"
  F2: "What medicines do you take when a headache strikes, and/or for prevention? (Type freely or leave blank)"
  F3: "Do you take any pain-relief or headache medication on 10 or more days every month?"
  F4: "Which factors, if any, do you think trigger or bring on your headache attacks? (Select all that apply)"
  F5: "Do your headache attacks regularly occur around the time of your menstrual period?"
  F6: "Any other medical conditions or additional notes you'd like your doctor to know? (Optional — type freely)"

  L1: "Optional: On average, how many hours of sleep do you get per night?"
  L2: "Optional: On a scale of 0 to 10, how would you rate your typical daily stress level?"

