consent:
  title: "Clinical Intake & Privacy Consent"
  welcome: "Welcome. This intake interview helps your doctor understand your headache history before your consultation."
  purpose_body: "1. Purpose: This system collects your headache symptoms to prepare a structured report for your treating doctor.\n2. Not a Diagnosis: This chatbot does NOT diagnose conditions, prescribe medications, or adjust doses. A qualified doctor will review all information.\n3. Emergencies: If you experience sudden, unbearable headache or sudden neurological symptoms, please seek emergency care.\n4. Privacy: Your answers are protected and linked only to an anonymous session code."
  agree_terms: "I understand and agree to proceed with this intake interview."
  research_consent: "Optional: I consent to having my anonymized headache answers included in headache research studies."
  continue_button: "I Agree & Begin"

acknowledgements:
  - "Thank you. That helps."
  - "Got it, thank you."
  - "Understood."
  - "Thank you for sharing that."
  - "Noted, thank you."

red_flag_alert:
  title: "URGENT MEDICAL ATTENTION RECOMMENDED"
  message: "Based on the symptom you described, you need a doctor's attention promptly. Please contact a doctor or go to the nearest emergency room right away. If you cannot travel immediately, call national emergency 112 or ambulance 108. Do not wait for this questionnaire."
  instruction: "The interview has been safely paused. A brief emergency summary has been prepared for your healthcare provider."

confirmation:
  voice_echo: "I understood: \"{value}\". Is this correct?"
  buttons:
    yes: "Yes, that's right"
    no: "No, let me change"

completion:
  thank_you: "Thank you. Your answers have been safely recorded and prepared for your doctor to review."
  summary_title: "Intake Summary"
  download_btn: "Download Patient Summary PDF"
  status_notice: "Status: Ready for clinician review. Your doctor will discuss these findings with you."

questions:
  E1: "Did your headache start extremely suddenly and reach maximum agony within about 1 minute (like a sudden explosion or thunderclap)?"
  E2: "Is this the worst headache of your entire life, or a first-ever severe headache?"
  E3: "Do you have any new muscle weakness, numbness, trouble speaking, or confusion that is different from your usual headaches?"
  E4: "Did you faint, lose consciousness, have a seizure, or experience a sudden drop in alertness?"
  E5: "Do you currently have a fever combined with a stiff neck or a new skin rash?"
  E6: "Have you noticed any sudden vision loss or major new change in your eyesight?"
  E7: "Did this headache start shortly after a head injury or physical trauma?"
  E8: "Did your headaches begin for the first time after age 50, or has your headache pattern recently become clearly different or much worse?"

  P1: "What is your current age in years?"
  P2: "What was your biological sex assigned at birth?"
  P3: "What is your height in centimeters (optional)?"
  P4: "What is your weight in kilograms (optional)?"
  P5: "Around what age did your headaches first begin?"
  P6: "Approximately how many headache attacks have you experienced in your whole life?"

  H1: "When you do not take pain medication, how long does a typical headache attack usually last?"
  H2: "On average, how many days per month do you experience a headache?"
  H3: "Where is the pain usually located?"
  H4: "How would you describe the sensation or character of the pain?"
  H5: "How intense is your headache typically?"
  H6: "Does routine physical activity (such as walking, bending, or climbing stairs) make your headache noticeably worse?"
  H7: "Do you feel sick to your stomach (nausea) during the headache?"
  H8: "Do you actually vomit (throw up) during the headache?"
  H9: "Does normal everyday sound bother you or feel painful during your headache (sound sensitivity)?"
  H10: "Does everyday light hurt your eyes or feel uncomfortable during your headache (light sensitivity)?"

  A1: "Do you get temporary visual disturbances before or during the headache that completely disappear? (Select all that apply)"
  A2: "Do you experience temporary numbness or tingling sensations that spread and then completely go away?"
  A3: "Do you have temporary trouble finding words or speaking clearly during attacks?"
  A4: "Does your speech sound slurred or mumbled during attacks?"
  A5: "Do you feel a temporary spinning or rotating sensation (vertigo) with attacks?"
  A6: "Do you hear a ringing, hissing, or buzzing noise in your ears (tinnitus)?"
  A7: "Do you notice a temporary drop or muffling in your hearing during attacks?"
  A8: "Do you see double (diplopia) during the attacks?"
  A9: "Is there a temporary blind area in both eyes' field of vision?"
  A10: "Do you feel unsteady on your feet or struggle with balance (ataxia) during attacks?"
  A11: "Do you experience reduced awareness, drowsiness, or fainting during attacks?"
  A12: "Do you feel pins-and-needles or numbness on BOTH sides of your body at the same time?"
  A13: "Do you ever have muscle weakness on one side of your body during headache attacks?"
  A14: "When you experience these warning or neurological symptoms, how long do they typically last?"
  A15: "Do all of these warning symptoms completely disappear once the attack is over?"
  A16: "Do the warning symptoms build up gradually over 5 or more minutes?"
  A17: "Do two or more different warning symptoms follow one another in succession?"
  A18: "Are the warning symptoms experienced on only one side of your body or visual field?"
  A19: "Does your headache come during the warning symptoms, or start within 60 minutes after they begin?"

  F1: "Does anyone in your immediate family (parents, siblings, children) experience diagnosed migraine or recurrent severe headaches?"
  F2: "Do you have any other ongoing medical conditions (e.g. hypertension, asthma, diabetes)? If yes, please type them or click None."
  F3: "What medicines do you take when a headache attack starts, and about how many days per month do you take them?"
  F4: "Have you ever taken or are you currently taking any daily preventive medicines prescribed specifically to reduce headache frequency?"
  F5: "Do you take any pain-relief or headache medication on 10 or more days every month?"
  F6: "Which factors, if any, do you think trigger or bring on your headache attacks? (Select all that apply)"
  F7: "Do your headache attacks regularly occur around the time of your menstrual period?"
  F8: "Is there anything else important about your headaches that you would like your doctor to know?"

  L1: "Optional Lifestyle Block: On average, how many hours of sleep do you get per night?"
  L2: "On a scale of 0 to 10, how would you rate your typical daily stress level?"
  L3: "Approximately how much plain water do you drink daily (in liters or glasses)?"
  L4: "How many cups of caffeinated coffee or tea do you typically drink per day?"
  L5: "Approximately how many hours per day do you spend looking at digital screens?"

