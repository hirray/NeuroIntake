# Fixed Human-Reviewed Question Bank for MigraineAssist Intake (Optimised — v2)
# Consolidation strategy:
#   Safety: merged E1–E8 into two composite questions (E1, E2)
#   Profile: P3/P4 (height/weight) removed as non-diagnostic; P3 = onset age, P4 = lifetime attacks
#   Headache: H7/H8 → single nausea_vomiting question; H9/H10 → single sensory question
#   Aura: A3–A13 collapsed into A2 (composite neurological aura); A15–A19 kept for ICHD-3 spec
#   History/Lifestyle: merged lifestyle block (L1–L5) into one multi-part question

questions:
  # ================= SECTION E: SAFETY & RED FLAGS =================
  - id: E1
    section: S
    type: multi_choice
    report_label: "Acute danger symptoms (select all that apply)"
    coding: AcuteDangerSymptoms
    required: true
    is_red_flag: true
    translations_key: questions.E1
    glossary_ref: thunderclap
    options:
      - code: thunderclap
        label_key: options.redflag_thunderclap
      - code: worst_headache
        label_key: options.redflag_worst
      - code: neuro_deficit
        label_key: options.redflag_neuro
      - code: syncope_seizure
        label_key: options.redflag_syncope
      - code: none
        label_key: options.none

  - id: E2
    section: S
    type: multi_choice
    report_label: "Additional red-flag warning signs (select all that apply)"
    coding: AdditionalRedFlags
    required: true
    is_red_flag: true
    translations_key: questions.E2
    options:
      - code: fever_neck
        label_key: options.redflag_fever
      - code: vision_loss
        label_key: options.redflag_vision
      - code: post_trauma
        label_key: options.redflag_trauma
      - code: late_onset
        label_key: options.redflag_lateonset
      - code: none
        label_key: options.none

  # ================= SECTION P: PATIENT PROFILE =================
  - id: P1
    section: P
    type: number
    report_label: "Age (years)"
    coding: Age
    required: true
    validation:
      min: 5
      max: 120
    translations_key: questions.P1

  - id: P2
    section: P
    type: single_choice
    report_label: "Biological Sex"
    coding: Sex
    required: true
    options:
      - code: female
        label_key: options.sex_female
      - code: male
        label_key: options.sex_male
      - code: other_or_prefer_not_to_say
        label_key: options.sex_other
    translations_key: questions.P2

  - id: P3
    section: P
    type: number
    report_label: "Age when headaches first started"
    coding: OnsetAge
    required: true
    validation:
      min: 1
      max: 120
    translations_key: questions.P3

  - id: P4
    section: P
    type: single_choice
    report_label: "Lifetime headache attacks count"
    coding: LifetimeAttacks
    required: true
    options:
      - code: less_than_5
        label_key: options.less_than_5
      - code: five_or_more
        label_key: options.five_or_more
    translations_key: questions.P4

  # ================= SECTION H: HEADACHE CHARACTERISTICS =================
  - id: H1
    section: H
    type: single_choice
    report_label: "Typical untreated duration"
    coding: Duration
    required: true
    options:
      - code: less_than_4h
        label_key: options.duration_under_4h
      - code: 4_to_72h
        label_key: options.duration_4_to_72h
      - code: more_than_72h
        label_key: options.duration_over_72h
      - code: unknown
        label_key: options.unknown
    translations_key: questions.H1

  - id: H2
    section: H
    type: number
    report_label: "Headache frequency (days/month)"
    coding: Frequency
    required: true
    validation:
      min: 0
      max: 31
    translations_key: questions.H2

  - id: H3
    section: H
    type: single_choice
    report_label: "Pain location"
    coding: Location
    required: true
    options:
      - code: one_sided
        label_key: options.location_one_side
      - code: both_sides
        label_key: options.location_both_sides
      - code: varies
        label_key: options.location_varies
      - code: unknown
        label_key: options.unknown
    translations_key: questions.H3

  - id: H4
    section: H
    type: single_choice
    report_label: "Pain character / quality"
    coding: Character
    required: true
    options:
      - code: throbbing_pulsating
        label_key: options.character_throbbing
      - code: constant_pressure_tight
        label_key: options.character_constant_pressure
      - code: stabbing_sharp
        label_key: options.character_stabbing
      - code: other
        label_key: options.character_other
      - code: unknown
        label_key: options.unknown
    translations_key: questions.H4

  - id: H5
    section: H
    type: single_choice
    report_label: "Pain intensity"
    coding: Intensity
    required: true
    options:
      - code: mild
        label_key: options.intensity_mild
      - code: moderate
        label_key: options.intensity_moderate
      - code: severe
        label_key: options.intensity_severe
      - code: unknown
        label_key: options.unknown
    translations_key: questions.H5

  - id: H6
    section: H
    type: yes_no
    report_label: "Worse with routine activity (walking/stairs)"
    coding: RoutineActivityAggravation
    required: true
    translations_key: questions.H6

  # Merged H7 (Nausea) + H8 (Vomiting) into one composite question
  - id: H7
    section: H
    type: multi_choice
    report_label: "Nausea and / or vomiting during headache"
    coding: NauseaVomiting
    required: true
    translations_key: questions.H7
    options:
      - code: nausea
        label_key: options.symptom_nausea
      - code: vomiting
        label_key: options.symptom_vomiting
      - code: none
        label_key: options.none

  # Merged H9 (Phonophobia) + H10 (Photophobia) into one composite question
  - id: H8
    section: H
    type: multi_choice
    report_label: "Light / sound sensitivity during headache"
    coding: Photophonophobia
    required: true
    translations_key: questions.H8
    options:
      - code: light_sensitive
        label_key: options.symptom_light
      - code: sound_sensitive
        label_key: options.symptom_sound
      - code: none
        label_key: options.none

  # ================= SECTION A: AURA & NEUROLOGICAL SYMPTOMS =================
  - id: A1
    section: A
    type: multi_choice
    report_label: "Reversible visual disturbances before/during headache (types)"
    coding: Visual
    required: true
    options:
      - code: zigzag_lines
        label_key: options.visual_zigzag
      - code: flashing_lights
        label_key: options.visual_flashing
      - code: bright_spots
        label_key: options.visual_spots
      - code: blurred_patches
        label_key: options.visual_blurred
      - code: none
        label_key: options.none
    translations_key: questions.A1
    glossary_ref: visual_aura

  # Merged A2 (sensory tingling/numbness) + A3–A13 into a single composite neuro-aura question
  - id: A2
    section: A
    type: multi_choice
    report_label: "Other neurological warning symptoms (select all that apply)"
    coding: NeurologyAura
    required: true
    translations_key: questions.A2
    options:
      - code: spreading_tingling
        label_key: options.sensory_tingling
      - code: spreading_numbness
        label_key: options.sensory_numbness
      - code: word_finding
        label_key: options.aura_dysphasia
      - code: slurred_speech
        label_key: options.aura_dysarthria
      - code: vertigo
        label_key: options.aura_vertigo
      - code: double_vision
        label_key: options.aura_diplopia
      - code: unsteady_walk
        label_key: options.aura_ataxia
      - code: muscle_weakness_one_side
        label_key: options.aura_motorweakness
      - code: none
        label_key: options.none

  - id: A3
    section: A
    type: single_choice
    report_label: "Typical aura duration"
    coding: AuraDuration
    required: true
    options:
      - code: less_than_5min
        label_key: options.aura_duration_under_5m
      - code: 5_to_60min
        label_key: options.aura_duration_5_60m
      - code: more_than_60min
        label_key: options.aura_duration_over_60m
      - code: no_aura
        label_key: options.no_aura
      - code: unknown
        label_key: options.unknown
    translations_key: questions.A3

  # ================= SECTION F: HISTORY, TRIGGERS & MEDICATIONS =================
  - id: F1
    section: F
    type: yes_no
    report_label: "Family history of migraine (1st degree)"
    coding: DPF
    required: true
    translations_key: questions.F1

  - id: F2
    section: F
    type: free_text
    report_label: "Medications taken during attacks and/or for prevention"
    coding: Medications
    required: false
    translations_key: questions.F2

  - id: F3
    section: F
    type: yes_no
    report_label: "Pain medication taken on 10+ days/month"
    coding: MedicationOveruse10Days
    required: true
    translations_key: questions.F3

  - id: F4
    section: F
    type: multi_choice
    report_label: "Suspected attack triggers (select all that apply)"
    coding: Triggers
    required: false
    options:
      - code: poor_sleep
        label_key: options.trigger_sleep
      - code: stress
        label_key: options.trigger_stress
      - code: skipped_meals
        label_key: options.trigger_meals
      - code: dehydration
        label_key: options.trigger_dehydration
      - code: caffeine
        label_key: options.trigger_caffeine
      - code: screen_time
        label_key: options.trigger_screens
      - code: weather_change
        label_key: options.trigger_weather
      - code: hormones_periods
        label_key: options.trigger_hormones
      - code: strong_smells
        label_key: options.trigger_smells
      - code: food
        label_key: options.trigger_food
      - code: other
        label_key: options.trigger_other
    translations_key: questions.F4

  - id: F5
    section: F
    type: yes_no
    report_label: "Headaches correlated with menstrual period"
    coding: MenstrualRelated
    required: false
    skip_if:
      field: P2
      equals: male
    translations_key: questions.F5

  - id: F6
    section: F
    type: free_text
    report_label: "Other medical conditions or additional notes for the doctor"
    coding: PatientNotes
    required: false
    translations_key: questions.F6

  # ================= SECTION L: LIFESTYLE (MERGED SINGLE QUESTION) =================
  - id: L1
    section: L
    type: number
    report_label: "Average sleep hours per night"
    coding: LifestyleSleep
    required: false
    validation:
      min: 1
      max: 18
    translations_key: questions.L1

  - id: L2
    section: L
    type: scale_0_10
    report_label: "Typical daily stress (0 to 10)"
    coding: LifestyleStress
    required: false
    validation:
      min: 0
      max: 10
    translations_key: questions.L2
